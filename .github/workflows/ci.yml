# Sahip: Berat (YOL_HARITASI.md §9).
# Path filter şart: Esra bir CSS değiştirdiğinde backend testleri koşmasın.
# contracts/ değişikliği ÜÇ job'ı birden tetikler — CI'ın asıl varlık sebebi bu.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# paths-filter, PR'da değişen dosyaları GitHub API'sinden okur; bunun için
# pull-requests: read şart. Repo varsayılanı bu izni vermediği için
# "Resource not accessible by integration" hatası alınıyordu.
permissions:
  contents: read
  pull-requests: read

jobs:
  degisenler:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filtre.outputs.core }}
      gateway: ${{ steps.filtre.outputs.gateway }}
      web: ${{ steps.filtre.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtre
        with:
          filters: |
            core:
              - 'services/core/**'
              - 'contracts/**'
            gateway:
              - 'services/gateway/**'
              - 'contracts/**'
            web:
              - 'web/**'
              - 'contracts/**'

  core:
    needs: degisenler
    if: needs.degisenler.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e "./services/core[dev]"
      - run: ruff check services/core contracts
      - run: pytest -q
        working-directory: services/core

  gateway:
    needs: degisenler
    if: needs.degisenler.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e "./services/gateway[dev]"
      - run: ruff check services/gateway
      - run: pytest -q
        working-directory: services/gateway

  web:
    needs: degisenler
    if: needs.degisenler.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # TODO(Esra): `npm install` yaptıktan sonra package-lock.json'u commit et,
      # sonra burayı `npm ci` + setup-node cache'ine çevir (daha hızlı ve tekrarlanabilir).
      - run: npm install
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
