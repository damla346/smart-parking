[project]
name = "sp-gateway"
version = "0.1.0"
description = "Smart Parking — İletişim servisi (sahip: Berat)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# ruff sabit sürüm — gerekçe services/core/pyproject.toml'daki notta.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
